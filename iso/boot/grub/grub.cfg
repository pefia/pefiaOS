# iso/boot/grub/grub.cfg
# -----------------------------------------------------------------------------
# GRUB2 menu for the pefiaOS rescue ISO. The kernel's Multiboot header requests
# a linear graphics framebuffer; `insmod all_video` ensures GRUB has the video
# drivers loaded to honor that request before handing off.
# -----------------------------------------------------------------------------

insmod all_video

set timeout=0
set default=0

menuentry "pefiaOS" {
    multiboot /boot/pefiaos.bin
    boot
}
