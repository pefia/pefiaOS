# iso/boot/grub/grub.cfg
# GRUB menu for the pefiaOS rescue ISO.
#
# insmod all_video pulls in GRUB's video drivers before boot. gfxpayload is
# forced per-entry because GRUB does not reliably honor the mode requested in
# the kernel's Multiboot header on its own (it fell back to 640x480 on QEMU);
# the fallback chain still boots on hardware that lacks a 1080p VBE mode.

insmod all_video

set timeout=0
set default=0

menuentry "pefiaOS" {
    set gfxpayload=1920x1080x32,1280x720x32,1024x768x32,auto
    multiboot /boot/pefiaos.bin
    boot
}
