# iso/boot/grub/grub.cfg
# GRUB menu for the pefiaOS rescue ISO.
#
# insmod all_video pulls in GRUB's video drivers before boot, which is what
# lets it honor the framebuffer mode requested by the kernel's Multiboot header.

insmod all_video

set timeout=0
set default=0

menuentry "pefiaOS" {
    multiboot /boot/pefiaos.bin
    boot
}
